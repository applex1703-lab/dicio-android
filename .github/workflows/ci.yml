name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'meta/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'meta/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test-jvm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make sure Gradle wrapper is legitimate
        uses: gradle/actions/wrapper-validation@v5

      - name: Create and checkout branch that will be used as app name
        # push events already checked out the branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: git checkout -B "$BRANCH"

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Build debug APK and run jvm tests
        # Repository archives may not preserve the executable bit on gradlew.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest --stacktrace

      - name: Upload unsigned CI debug APK for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: app
          path: app/build/outputs/apk/debug/*.apk

  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Create branch for pull request build
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: git checkout -B "$BRANCH"
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          script: |
            chmod +x gradlew
            adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
            adb -s emulator-5554 shell wm dismiss-keyguard
            # Exercise TV-style directional navigation, not touch-mode focus.
            adb -s emulator-5554 shell input keyevent KEYCODE_DPAD_DOWN
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=org.stypox.dicio.screenshot.ScreenshotTakerTest --stacktrace
            python3 -c 'import glob, sys, xml.etree.ElementTree as ET; files = glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True); classes = {case.get("classname") for path in files for case in ET.parse(path).iter("testcase") if case.find("skipped") is None}; required = {"org.stypox.dicio.io.input.GoogleSpeechInputDeviceTest", "org.stypox.dicio.voice.VoiceInputCoordinatorTest"}; missing = required - classes; print("Required voice test classes executed:", len(required) - len(missing), "/", len(required)); sys.exit(bool(missing))'
      - name: Summarize failed Android tests
        if: failure()
        run: |
          python3 -c 'import glob, xml.etree.ElementTree as ET; files = glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True); [(print("::error::" + (str(case.get("classname")) + " " + str(case.get("name")) + " " + (failure.get("message") or "")[:500] + " " + (failure.text or "")[:2000]).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))) for path in files for case in ET.parse(path).iter("testcase") for failure in list(case) if failure.tag in ("failure", "error")]; print("Test reports:", len(files))'
      - name: Upload Android test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-results
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn

  sign-tv-apk:
    # Never expose the signing key to pull request code or non-main refs.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-and-test-jvm, android-instrumentation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Build APK for TV package
        run: |
          git checkout -B main "$GITHUB_SHA"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Sign and verify TV APK
        env:
          KEYSTORE_BASE64: ${{ secrets.DICIO_TV_SIGN_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.DICIO_TV_SIGN_PASSWORD }}
          EXPECTED_FINGERPRINT: ${{ secrets.DICIO_TV_SIGN_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$EXPECTED_FINGERPRINT"
          umask 077
          KEYSTORE="$RUNNER_TEMP/dicio-tv-signing.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          unset KEYSTORE_BASE64
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          INPUT="app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT="$RUNNER_TEMP/dicio-tv.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias dicio-tv --ks-pass env:KEYSTORE_PASSWORD --out "$OUTPUT" "$INPUT"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT" > "$RUNNER_TEMP/dicio-cert.txt"
          grep -Fx 'Number of signers: 1' "$RUNNER_TEMP/dicio-cert.txt" >/dev/null
          CERT=$(sed -n -E 's/^[[:space:]]*(Signer #1|V[0-9.]+ Signer):?[[:space:]]*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/dicio-cert.txt" | tr -d '\r:[:space:]' | tr '[:lower:]' '[:upper:]')
          if [[ "$CERT" != "$EXPECTED_FINGERPRINT" ]]; then
            echo "Certificate verification failed: actual length ${#CERT}, expected length ${#EXPECTED_FINGERPRINT}"
            cat "$RUNNER_TEMP/dicio-cert.txt"
            exit 1
          fi
          echo "Signing certificate verified"
          "$BUILD_TOOLS/aapt" dump badging "$OUTPUT" > "$RUNNER_TEMP/dicio-badging.txt"
          if ! grep -F "package: name='org.stypox.dicio.main' " "$RUNNER_TEMP/dicio-badging.txt" >/dev/null; then
            echo "Unexpected application package"
            exit 1
          fi
          echo "Verified TV package and expected signing certificate"
      - name: Upload verified signed TV APK
        uses: actions/upload-artifact@v6
        with:
          name: app
          path: ${{ runner.temp }}/dicio-tv.apk
